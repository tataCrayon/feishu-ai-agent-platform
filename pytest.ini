# pytest 配置 — 只声明跨机器必需的项，不放与工具链无关的开关。

[pytest]
testpaths = tests app
python_files = test_*.py
# pytest 默认的 `%TEMP%\pytest-of-<user>` 在本仓的 Windows 环境下 ACL 拒绝访问
# （PermissionError: WinError 5），`tmp_path` 因此整体不可用——而那是最常用的
# 夹具。落到仓库内的 temp/（已 gitignore）：可写、可清理、与代码同盘。
# 显式 `--basetemp=` 仍然覆盖这里，门禁脚本照旧可以指定独立目录。
addopts = --basetemp=temp/pytest-tmp
