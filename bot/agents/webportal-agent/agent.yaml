# Agent: webportal-agent — 工单 → SQL Agent（webportal-order-agent A2A 服务客户端）
# A2A 客户端 Handler（app/agents/handlers/webportal_handler.py 自动发现），
# 能力承载在独立仓库 webportal-order-agent（A2A Server 127.0.0.1:8080，独立迭代独立发布）
# version: 3.1.0 | updated: 2026-10-07 | author: @devuser
# tags: [webportal, ticket, a2a, handler]
# changelog: v3.1.0 (2026-10-07) 案例沉淀扩源 + 飞书案例库镜像同步：ingest_order
#   接 CMDB 工单号 / 飞书文档链接（feishu_url，本侧取正文），落 draft 后自动建
#   飞书子文档 + 更新目录索引；新增 sync_case 定稿后重同步镜像
# changelog: v3.0.0 (2026-10-04) 去 vendor 切 A2A：删除 bot/skills/order-sql 引擎拷贝，
#   handler 改为 A2A message:send 客户端（附件文件 Part 原样透传，解析在服务端），
#   上游独立发版、手工 sync 提交（AI:sync(order-sql)）退出历史
# changelog: v2.1.0 (2026-09-11) 双源漂移整改：弃内联 system_prompt 改 prompt_ref（P1-3，六支柱审查）
# changelog: v2.0.0 (2026-09-11) 重构：不再依赖外部 webportal-pilot Pipeline API，
#   transport 改为 handler，能力由 bot/skills/order-sql 引擎承载（verified 案例背书 + advisory 参考建议）
# changelog: v1.1.0 (2026-08-24) 平级化：声明 transport=webportal + exclusive_domain
# changelog: v1.0.0 (2026-08-17) 初始版本，直接调用外部 Pipeline API
name: webportal-agent
display_name: "工单系统 Agent"
# 路由级描述（单源：同时用作路由工具 description 与 /help 能力清单）
description: "工单系统/数据库变更申请：处理工单、工单转 SQL、生成 SQL 变更方案、解析审批文本、解析飞书审批链接（go.feishu.cn/approval，读取审批表单与附件）、案例检索、沉淀案例（CMDB 工单号或飞书文档链接入案例库，并同步飞书案例库镜像）、同步案例。用户想处理工单或数据库变更、发来审批链接、要把工单处理过程沉淀成案例时使用"
permission_level: 1
model: sonnet
enabled: true
# 编排层硬上限（2026-11-02 起该值真正被消费：超过即放弃并回执，见 crew._agent_hard_timeout）。
# 观测 success 任务最长 482s（多轮工具累计），按 1.5x 留余量取 720s；
# 单轮 A2A 等待上限仍是 handler 内的 _A2A_TIMEOUT_SEC=300s，两者不同层。
timeout_sec: 720
# 执行通道：进程内 Handler 壳（webportal_handler.py），工具执行走 A2A HTTP
transport: handler
exclusive_domain: true
work_dir: "./bot/agents/webportal-agent"
# 单一事实源：prompt 从 bot/prompts/agents/webportal-agent.md 加载（PromptLoader）
prompt_ref: "agents/webportal-agent.md"
mcp_servers: {}
