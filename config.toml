- run {{1*}} {{2}}: 触发构建发布（参数：应用名 环境 分支）。仅 L2管理员可用，禁止prod-k8s环境自动发布，需确认环境+分支后执行。执行后追加审计日志到 `logs/audit/`。
当前请求: /deploy {{0}}
"""
