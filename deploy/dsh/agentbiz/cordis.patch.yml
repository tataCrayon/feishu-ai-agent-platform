# feishu-agent-platform 专用 dsh profile 补丁层（profile=agentbiz）。
#
# 用法：由 app/dsh/supervisor.py 以 `--patch <本文件>` 叠加，不复制进 DSH_HOME。
# 引擎与网关段移植自 acp profile（aigw 网关）。默认路由用 flp-self-oai（openai-completions）：
# flf-whx（anthropic-messages）的 key 只从 .credentials.yaml 读、不吃进程 env，
# bot 独立 DSH_HOME 下拿不到；见 README「凭据实测结论」。
#
# 与 acp profile 的差异见文末两段：skill-filesystem（关默认技能根）与 acp（默认路由）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      flp-self-oai:
        displayName: flp-self-oai
        # 凭据从进程 env 读；supervisor 按 config.toml [projects.dsh].api_key
        # （或 DSH_API_KEY）注入，所以这里不绑定某个固定变量名。
        apiKeyEnv: AIGW_API_KEY
        api: openai-completions
        baseURL: https://aigw.example.com/v1
        models:
          # 默认模型：最便宜的一档，日常路由与轻任务用它
          #
          # input 必须显式声明的理由：dsh 的 ACP 桥在 initialize 时用
          # `resolveModelInfo().inputModalities` 决定是否广告 `promptCapabilities.image`，
          # 而 pi-ai 的 openai-completions 路由**不会**从网关探测模态，只读这里的声明。
          # 不写 image 的表现是会话里发图被拒（"inline image prompts were not
          # advertised by this connection"），而不是模型看不懂图。
          - id: glm-5.3-flash
            name: glm-5.3-flash
            input:
              - text
              - image
          - id: deepseek-v4.1-flash-1017
            name: deepseek-v4.1-flash-1017
            contextWindow: 1000000
            maxTokens: 256000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
      flp-self:
        apiKeyEnv: AIGW_API_KEY
        api: anthropic-messages
