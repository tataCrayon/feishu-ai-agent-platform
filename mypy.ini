# mypy 增量门禁配置
# 策略：存量代码不强求全绿，改动模块必须类型自洽（见 python-dev-guard skill 闸 1）
# 用法：python -X utf8 -m mypy app/orchestrator/crew.py
#   -X utf8 必需：本文件含中文注释，Windows 默认 cp936 读 ini 会 UnicodeDecodeError
#   直接崩掉 mypy（2026-11-02 实测；不加就是「门禁本身先挂」）。

[mypy]
python_version = 3.11
ignore_missing_imports = True
# 存量宽松三件套：不查未标注函数体、允许隐式 Optional 渐进收紧
check_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
# 排除独立分发包与生成物
exclude = (?x)(bot/skills/|logs/|\.claude/|\.agent/)
# 存量豁免：AgentRegistry.list 方法名与内建 list 泛型在注解位置冲突（历史命名）
[mypy-app.agents.registry]
disable_error_code = valid-type
# 存量豁免：openai SDK 的 TypedDict 消息参数与项目 dict 构造不兼容（build_cacheable_messages 待改造）
[mypy-app.orchestrator.*]
disable_error_code = call-overload, arg-type
[mypy-app.agents.handlers.*]
disable_error_code = call-overload, arg-type
