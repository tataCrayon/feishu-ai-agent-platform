# Agent: prd-watch-agent — easyprd 手动入口（PRD 变更助手）
# 独立配置，不依赖 agents.yaml 单文件
# version: 1.0.0 | updated: 2026-11-02 | author: @devuser
# tags: [easyprd, prd, change-watch, feishu-doc] | cache_hint: low-frequency
# changelog: v1.0.0 (2026-11-02) 初始版本：常驻监听在旁路（app/domains/prd_watch），
#   本 Agent 只承担「查状态 / 立刻整理当前群讨论」两个主动入口。
name: prd-watch-agent
display_name: "PRD 变更助手"
# 路由级描述（单源：同时用作路由工具 description 与 /help 能力清单）
description: "easyprd PRD 变更助手：查 PRD 变更监听状态（盯了哪些群/是否干跑/识别计数），或立刻把当前群刚讨论的需求变更整理成 PRD 评论变更建议。用户问「PRD 监听在跑吗、识别准不准、把刚才讨论的变更写进 PRD」时使用。不改 PRD 正文、不猜需求绑定"
permission_level: 1
model: haiku
enabled: true
# 一次窗口识别 = 1 次 LLM + 可能的 PRD 全文取数，给足 180s（比 handler 内部
# 150s flush 上限宽，让 handler 先给出「超时转后台」的定制文案）
timeout_sec: 180
# 执行通道：进程内 Handler（app/agents/handlers/prd_watch_handler.py）
transport: handler
exclusive_domain: true
work_dir: "./bot/agents/prd-watch-agent"
# 单一事实源：从 bot/prompts/agents/prd-watch-agent.md 加载（PromptLoader）
prompt_ref: "agents/prd-watch-agent.md"
mcp_servers: {}
