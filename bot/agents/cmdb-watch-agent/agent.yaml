# Agent: cmdb-watch-agent — CMDB 生产工单提醒（自助订阅）
# 独立配置，不依赖 agents.yaml 单文件
# version: 1.3.0 | updated: 2026-11-13 | author: @devuser
# tags: [cmdb, order, watch, subscription, notification] | cache_hint: low-frequency
# changelog: v1.3.0 (2026-11-13) 支持 UAT 工单：按姓名订阅同时扫生产与 UAT 两套
#   工单表（卡片标题带「· UAT」、链接指向 UatOrderDetail）；按单号关注从链接或
#   env 参数识别环境。两套 order_id 独立，同号不同单。
# changelog: v1.2.0 (2026-11-06) 开放订阅：可按任务类型过滤（SQL/应用发布/Nacos 配置/
#   定时任务，可多选），50 人规模下每轮请求数只随「还在跑的工单」增长、不随人数增长。
# changelog: v1.1.0 (2026-11-04) 新增指定工单关注：按单号盯整单进度，开始执行与
#   全部完成各提醒一次（有失败标红）；list/unwatch 两个配套工具。
# changelog: v1.0.0 (2026-11-04) 初始版本：任何人自助订阅自己的 CMDB 用户名，
#   常驻旁路（app/domains/cmdb_watch/）按订阅者推送工单卡片。
name: cmdb-watch-agent
display_name: "CMDB 工单提醒"
# 路由级描述（单源：同时用作路由工具 description 与 /help 能力清单）
description: "CMDB 工单提醒两条链路，任何人可自助开通、不需要管理员：① 按姓名订阅——用户给出自己的 CMDB 用户名（如 devuser）后，生产与 UAT 工单里只要有他创建的任务，新工单 / 开始执行 / 完成或失败时逐条私聊推送；可按类型筛选（SQL 变更 / 应用发布 / Nacos 配置 / 定时任务，可多选，默认全收），即「只提醒我提交的 SQL」「只提醒我的应用发布」；② 按单号关注——盯某张指定工单（生产或 UAT，链接可自动识别）的整单进度，开始执行与全部完成各提醒一次（有失败标红）。也支持查订阅状态与当前提醒范围、列关注中的单、取消订阅/关注。用户说「订阅 CMDB 工单提醒、有我的工单就提醒我、只提醒我发的 SQL、只看我的发布、关注工单 5778 的执行情况、关注这个 UAT 单、这张单发完告诉我、别再盯这张单」时使用。只读 CMDB，不触发任何执行动作，不订阅别人的工单"
permission_level: 0
model: haiku
enabled: true
timeout_sec: 60
# 执行通道：进程内 Handler（app/agents/handlers/cmdb_watch_handler.py）
transport: handler
exclusive_domain: true
work_dir: "./bot/agents/cmdb-watch-agent"
# 单一事实源：从 bot/prompts/agents/cmdb-watch-agent.md 加载（PromptLoader）
prompt_ref: "agents/cmdb-watch-agent.md"
mcp_servers: {}
